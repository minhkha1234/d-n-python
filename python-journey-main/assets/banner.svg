    <rect x="145" width="130" height="82" rx="16" fill="#0b1b31" stroke="#2b5d91"/><text x="210" y="35" text-anchor="middle" font-size="27" fill="#5ce1b5">▱</text><text x="210" y="63" text-anchor="middle">Modules</text>
    <rect x="290" width="130" height="82" rx="16" fill="#0b1b31" stroke="#2b5d91"/><text x="355" y="35" text-anchor="middle" font-size="28" fill="#a88bff">›_</text><text x="355" y="63" text-anchor="middle">CLI &amp; APIs</text>
