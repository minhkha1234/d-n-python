      <text x="28" y="173" fill="#6d8eb4">03</text><text x="82" y="173" fill="#73dcff">    build</text><text x="156" y="173" fill="#d7e8ff">(goal)</text>
      <text x="28" y="214" fill="#6d8eb4">04</text><text x="82" y="214" fill="#b9a2ff">    return</text><text x="172" y="214" fill="#ffd166"> "progress"</text>
