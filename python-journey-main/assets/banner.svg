<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">Python Journey — Make Ideas Work</title>
<desc id="desc">A fresh light-themed Python Journey banner with blue and violet accents, a Python symbol, a code editor, and a learning roadmap.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e9f0ff"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#279af5"/><stop offset="1" stop-color="#2459d8"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#a88bff"/><stop offset="1" stop-color="#6e55de"/>
  </linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#20bfa7"/><stop offset="1" stop-color="#40d9cc"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1a376d" flood-opacity=".16"/>
  </filter>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#7d9dd4" opacity=".3"/>
  </pattern>
</defs>
<rect width="1600" height="600" rx="28" fill="url(#paper)"/>
<circle cx="90" cy="50" r="180" fill="#cce7ff" opacity=".44"/>
<circle cx="1490" cy="560" r="230" fill="#d9d2ff" opacity=".56"/>
<rect x="0" y="0" width="1600" height="600" rx="28" fill="url(#dots)" opacity=".65"/>
<g fill="none" stroke-linecap="round" stroke-width="3" opacity=".42">
  <path d="M0 120H118l28 28h82" stroke="#3e9cf4"/>
  <path d="M0 155H74l22 22h56" stroke="#8b74f8"/>
  <path d="M1600 110h-86l-26 26h-80" stroke="#2b9ed2"/>
  <path d="M1600 145h-50l-24 24h-60" stroke="#8b74f8"/>
  <path d="M50 520h88l20-20h95" stroke="#3e9cf4"/>
  <path d="M1515 490h-75l-22 22h-42" stroke="#20bfa7"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <g transform="translate(85 170)" filter="url(#shadow)">
    <circle cx="135" cy="120" r="122" fill="#ffffff" stroke="#dbe7fb" stroke-width="2"/>
    <circle cx="135" cy="120" r="104" fill="#eff6ff"/>
    <path d="M99 34h74c27 0 45 18 45 44v55c0 26-19 44-45 44h-57c-24 0-40 16-40 39v12H58c-26 0-42-17-42-43v-48c0-25 17-42 43-42h40V78c0-25 0-44 0-44z" fill="url(#blue)"/>
    <circle cx="119" cy="65" r="9" fill="#f8fbff"/>
    <path d="M151 155h57c25 0 43 17 43 43v48c0 27-18 44-45 44h-74c-26 0-44-18-44-44v-56c0-25 17-43 43-43h20z" fill="url(#violet)" transform="translate(-3 -15)"/>
    <circle cx="171" cy="249" r="9" fill="#f8fbff"/>
  </g>
  <text x="390" y="190" font-size="76" font-weight="800" fill="#162443" letter-spacing="-2">Python</text>
  <text x="390" y="278" font-size="88" font-weight="900" fill="#3167df" letter-spacing="-2">Journey</text>
  <rect x="394" y="308" width="78" height="7" rx="3.5" fill="url(#mint)"/>
  <text x="394" y="352" font-size="25" font-weight="600" fill="#526486">MAKE IDEAS WORK, ONE LINE AT A TIME.</text>
  <text x="394" y="391" font-size="18" fill="#7282a2">Learn the concepts. Practice the code. Build something real.</text>
  <g transform="translate(394 435)">
    <g>
      <rect width="150" height="74" rx="18" fill="#ffffff" stroke="#dce6f8" stroke-width="2"/>
      <circle cx="36" cy="37" r="20" fill="#e3f2ff"/><path d="M27 30l-8 7 8 7M45 30l8 7-8 7M39 25l-6 24" fill="none" stroke="#2876dd" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="43" font-size="18" font-weight="700" fill="#263756">Python</text>
    </g>
    <g transform="translate(166 0)">
      <rect width="150" height="74" rx="18" fill="#ffffff" stroke="#dce6f8" stroke-width="2"/>
      <circle cx="36" cy="37" r="20" fill="#e3fbf5"/><path d="M22 31l14-8 14 8-14 8zM22 38l14 8 14-8" fill="none" stroke="#159b87" stroke-width="2.8" stroke-linejoin="round"/>
      <text x="70" y="43" font-size="18" font-weight="700" fill="#263756">Modules</text>
    </g>
    <g transform="translate(332 0)">
      <rect width="150" height="74" rx="18" fill="#ffffff" stroke="#dce6f8" stroke-width="2"/>
      <circle cx="36" cy="37" r="20" fill="#f0eaff"/><rect x="23" y="26" width="26" height="22" rx="3" fill="none" stroke="#7a5cdd" stroke-width="2.5"/><path d="M29 32l5 5-5 5M38 42h6" fill="none" stroke="#7a5cdd" stroke-width="2.5" stroke-linecap="round"/>
      <text x="70" y="43" font-size="18" font-weight="700" fill="#263756">CLI &amp; APIs</text>
    </g>
    <g transform="translate(498 0)">
      <rect width="150" height="74" rx="18" fill="#ffffff" stroke="#dce6f8" stroke-width="2"/>
      <circle cx="36" cy="37" r="20" fill="#fff3d6"/><path d="M36 23l13 7v14l-13 7-13-7V30zM23 30l13 8 13-8M36 38v13" fill="none" stroke="#cb8a13" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="70" y="43" font-size="18" font-weight="700" fill="#263756">OOP</text>
    </g>
  </g>
  <g transform="translate(1080 83)" filter="url(#shadow)">
    <rect width="430" height="365" rx="24" fill="#ffffff" stroke="#d9e4f5" stroke-width="2"/>
    <path d="M24 0h382a24 24 0 0 1 24 24v35H0V24A24 24 0 0 1 24 0z" fill="#edf3ff"/>
    <circle cx="28" cy="30" r="6" fill="#ff7b86"/><circle cx="49" cy="30" r="6" fill="#ffca5c"/><circle cx="70" cy="30" r="6" fill="#4bcba4"/>
    <text x="102" y="36" font-size="15" fill="#6b7b9d">hello_world.py</text>
    <rect x="0" y="59" width="70" height="306" rx="0" fill="#f6f8ff"/>
    <g font-family="Consolas,monospace" font-size="16" fill="#9baaca">
      <text x="24" y="96">1</text><text x="24" y="136">2</text><text x="24" y="176">3</text><text x="24" y="216">4</text><text x="24" y="256">5</text><text x="24" y="296">6</text><text x="24" y="336">7</text>
    </g>
    <g font-family="Consolas,monospace" font-size="17">
      <text x="90" y="96" fill="#7958cb">def</text><text x="130" y="96" fill="#2469bd"> main():</text>
      <text x="90" y="136" fill="#526486">    course = </text><text x="222" y="136" fill="#159b87">"Python Journey"</text>
      <text x="90" y="176" fill="#7958cb">    print</text><text x="168" y="176" fill="#526486">(course)</text>
      <text x="90" y="216" fill="#7958cb">    return</text><text x="184" y="216" fill="#c58b18"> True</text>
      <path d="M90 241H397" stroke="#e5ebf6"/>
      <rect x="86" y="259" width="304" height="65" rx="12" fill="#eefaf7"/>
      <circle cx="108" cy="281" r="7" fill="#1eb394"/>
      <text x="126" y="286" font-size="15" fill="#187b68">Program ready</text>
      <text x="105" y="309" font-size="14" fill="#547f77">Learn  →  Build  →  Improve</text>
    </g>
  </g>
  <g transform="translate(1100 485)">
    <rect width="392" height="58" rx="18" fill="#263b73"/>
    <circle cx="29" cy="29" r="8" fill="#52dfc0"/><text x="50" y="36" font-size="19" font-weight="700" fill="#ffffff">SMALL STEPS. REAL PROGRESS.</text>
  </g>
